[package]
name = "kvault"
version = "0.2.0-dev"
edition = "2024"
rust-version = "1.95"
description = "Local-first knowledge index for coding agents: markdown in place, SQLite derived, token-budgeted recall"
license = "MIT"
repository = "https://github.com/rabrooks/kvault"
keywords = ["knowledge", "search", "memory", "cli", "claude-code"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
anyhow = "1.0"
blake3 = "1.8"
clap = { version = "4.5", features = ["derive", "env"] }
directories = "6.0"
glob = "0.3"
globset = "0.4"
serde_norway = "0.9"
ignore = "0.4"
jiff = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.9"

[features]
default = []
# MCP stdio adapter (milestone M6). Deliberately the only feature flag.
mcp = []

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.15"

[lints.clippy]
pedantic = "warn"
unwrap_used = "warn"
expect_used = "warn"
